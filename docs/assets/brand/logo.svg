<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- InvoiceGuard-AI Logo Concept
       Modern fintech mark: an invoice "page" fused with a protection shield.
       Palette (docs/BRAND.md):
         Primary #0F172A   Accent #3B82F6   Success #22C55E
         Warning #F59E0B   Danger  #EF4444
  -->
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M32 3 L54 10 V30 C54 44 45 54 32 61 C19 54 10 44 10 30 V10 Z"
        fill="url(#shield)"/>

  <!-- Shield inner border -->
  <path d="M32 7 L50 12.5 V30 C50 41.5 42.5 50 32 56 C21.5 50 14 41.5 14 30 V12.5 Z"
        fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.55"/>

  <!-- Document lines -->
  <g stroke="#94A3B8" stroke-width="2.4" stroke-linecap="round">
    <line x1="23" y1="24" x2="41" y2="24"/>
    <line x1="23" y1="31" x2="41" y2="31"/>
    <line x1="23" y1="38" x2="35" y2="38"/>
  </g>

  <!-- Checkmark (success) -->
  <polyline points="38,41 44,47 52,36" fill="none" stroke="#22C55E"
            stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent dot (analytics / AI) -->
  <circle cx="44" cy="18" r="3.2" fill="url(#accent)"/>
</svg>
